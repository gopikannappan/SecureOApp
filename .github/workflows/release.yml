name: Release to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (don't actually publish)"
        type: boolean
        default: false

# Trusted Publishing: npm authenticates this workflow via OIDC. No long-lived
# NPM_TOKEN secret stored in the repo — npm verifies the OIDC claim against
# the Trusted Publisher config set up on each package (see
# docs/RELEASE_AUTOMATION.md).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing support
        # Trusted Publishing needs npm >= 11.5.1. Node 22 bundles npm 10.x,
        # so we upgrade explicitly. Also used by pnpm under the hood.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install forge-std
        working-directory: contracts
        run: forge install foundry-rs/forge-std

      - name: Foundry tests (safety net)
        working-directory: contracts
        run: forge test

      - name: TS build + typecheck + test (safety net)
        run: |
          pnpm -r --filter "./packages/*" build
          pnpm -r --filter "./packages/*" typecheck
          pnpm -r --filter "./packages/*" test

      - name: Sanity check — tag matches package versions
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag version: $TAG_VERSION"
          for pkg in packages/core packages/cli packages/hardhat-plugin; do
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$pkg version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
              exit 1
            fi
            echo "$pkg version $PKG_VERSION matches tag"
          done

      - name: Publish to npm (dry run)
        if: inputs.dry_run == true
        run: pnpm publish -r --access public --no-git-checks --dry-run

      - name: Publish to npm (Trusted Publishing + provenance)
        if: inputs.dry_run != true
        run: |
          # pnpm rewrites workspace:* → concrete versions at publish time.
          # --provenance signs each publish with an audit trail linking the
          # artifact back to this workflow run and commit SHA.
          # --access public needed for scoped packages on first publish; a
          # no-op after the first publish.
          pnpm publish -r --access public --no-git-checks --provenance

name: Release to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (don't actually publish)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install forge-std
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          $HOME/.foundry/bin/foundryup
          cd contracts && $HOME/.foundry/bin/forge install foundry-rs/forge-std

      - name: Foundry tests (safety net)
        run: cd contracts && $HOME/.foundry/bin/forge test

      - name: TS build + test (safety net)
        run: |
          pnpm -r --filter "./packages/*" build
          pnpm -r --filter "./packages/*" typecheck
          pnpm -r --filter "./packages/*" test

      - name: Sanity check — tag matches package versions
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag version: $TAG_VERSION"
          for pkg in packages/core packages/cli packages/hardhat-plugin; do
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$pkg version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
              exit 1
            fi
            echo "$pkg version $PKG_VERSION matches tag"
          done

      - name: Publish to npm (dry run)
        if: inputs.dry_run == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm publish -r --access public --no-git-checks --dry-run

      - name: Publish to npm
        if: inputs.dry_run != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # pnpm auto-transforms workspace:* refs to the current version at publish time.
          # --no-git-checks because the release workflow runs on a detached head at the tag.
          # --access public needed for first publish of scoped packages.
          pnpm publish -r --access public --no-git-checks --provenance
